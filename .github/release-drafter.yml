name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧹 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'maintenance'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🧪 Testing'
    labels:
      - 'test'
      - 'testing'
  - title: '🔧 Refactoring'
    labels:
      - 'refactor'
      - 'refactoring'
  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'perf'
  - title: '🔒 Security'
    labels:
      - 'security'
      - 'sec'
  - title: '🚨 Breaking Changes'
    labels:
      - 'breaking'
      - 'breaking-change'

template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  ## Installation

  ```bash
  pip install srt-translator==$RESOLVED_VERSION
  ```

  ## Quick Start

  ```bash
  # CLI
  srt-cli --help

  # GUI
  srtx
  ```

  ## Documentation

  - [Installation Guide](https://github.com/your-org/srt_translator/blob/main/INSTALLATION.md)
  - [User Manual](https://github.com/your-org/srt_translator/blob/main/GUI_USER_MANUAL.md)
  - [Contributing Guide](https://github.com/your-org/srt_translator/blob/main/CONTRIBUTING.md)

  ---

  *This release was automatically generated by [Release Drafter](https://github.com/release-drafter/release-drafter)*

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
  default: patch
