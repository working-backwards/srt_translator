name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip
      - run: pip install .[dev]
      - run: ruff check . && ruff format --check . && mypy srt_translator
      - run: pytest -m "not gui" -q

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: |
          python -c "import srt_translator, srt_translator.cli.app; print('CLI import ok')"
          srtx --help

  gui-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip build
      - run: python -m build
      - run: pip install dist/*.whl[gui]
      - shell: python
        run: |
          try:
              import srt_translator.gui.main_window as mw
              print("GUI import ok")
          except Exception as e:
              raise SystemExit(1)

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip
      - run: pip install safety bandit
      - run: safety check
      - run: bandit -r srt_translator

  golden-tests:
    name: Golden Structure & Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .[dev]
          else
            echo "No requirements file found. Please add requirements-dev.txt or requirements.txt." >&2
            exit 1
          fi

      - name: Run golden tests
        shell: bash
        env:
          PYTHONWARNINGS: default
        run: |
          pytest tests/test_golden_srt.py -q

      - name: Always upload pytest cache (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-pytest-cache
          path: ./.pytest_cache
