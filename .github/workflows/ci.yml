name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    # Run on direct pushes to integration branches AND every feature/bug/fix
    # branch so client-side pre-commit hook bypasses are caught server-side
    # before they propagate. Without this, --no-verify pushes to a feature
    # branch only get checked at PR-open time, by which point the branch
    # may already have been touched by multiple contributors (see
    # 7eecebd which landed 3 hook violations on bugs/validation).
    branches:
      - main
      - develop
      - 'bugs/**'
      - 'feature/**'
      - 'feat/**'
      - 'issue/**'
      - 'fix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # Server-side enforcement of .pre-commit-config.yaml. The repo has
    # ruff/mypy/bandit hooks installed locally per contributor, but they
    # only run if `pre-commit install` was executed and not bypassed by
    # `git commit --no-verify`. This job catches both cases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pre-commit and project deps
        run: |
          python -m pip install -U pip
          python -m pip install pre-commit
          # mypy hook needs the project's import graph to resolve
          python -m pip install -e ".[dev,gui]"
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  wheel-install-smoke:
    # Catches packaging regressions like the model_config.json bug
    # (4504c71, 2026-03-11) that editable installs hide. Builds a wheel
    # and verifies critical imports + resource files outside editable
    # mode. Runs on both Windows and macOS because PyInstaller --add-data
    # uses different separators (; vs :) and the original bug also
    # affected scripts/build_app.py.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install build deps
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install build
      - name: Run wheel smoke test
        shell: bash
        run: python scripts/smoke_test_wheel.py

  lint-type-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with dev+gui)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,gui]"
      - name: Lint & typecheck
        shell: bash
        run: |
          ruff check .
          mypy srt_translator
      - name: Run tests
        shell: bash
        run: pytest -q

  package-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install (gui)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[gui]"
      - name: Test CLI import
        shell: bash
        run: |
          python -c "import srt_translator, srt_translator.cli.app; print('CLI import ok')"
          srtx --help

  gui-import:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install (gui)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[gui]"
      - name: Test GUI import
        shell: bash
        run: |
          python -c "import srt_translator; import srt_translator.gui.main_window as _; print('GUI import OK')"

  security-scan:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        shell: bash
        run: |
          python -m pip install -U pip setuptools
          python -m pip install bandit pip-audit
          python -m pip install -e ".[dev]"
      - name: Bandit (SAST)
        shell: bash
        run: bandit -q -r srt_translator -x tests
      - name: pip-audit (vulns; no API key)
        shell: bash
        run: |
          # audit installed environment (no auth required)
          # Ignored CVEs:
          #   CVE-2026-4539: pre-existing exception (review when fix lands).
          #   CVE-2026-3219: pip polyglot tar+ZIP archive confusion (CVSS 4.6,
          #     requires user-supplied malicious archive). CI installs only
          #     from PyPI with pinned deps — no exposure. No upstream fix yet
          #     (pip PR #13870). Remove once a fixed pip is released.
          pip-audit -v --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219

  golden-tests:
    name: Golden Structure & Invariants
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Run golden tests
        env:
          PYTHONWARNINGS: default
        run: |
          pytest tests/test_golden_srt.py -q

      - name: Always upload pytest cache (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-pytest-cache-${{ matrix.os }}
          path: ./.pytest_cache
