name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: |
          python -m pip install -U pip
          python -m pip install .[dev,gui]
      - name: Ruff (lint)
        run: ruff check .
      - name: mypy
        run: mypy srt_translator
      - name: Run tests
        run: pytest -m "not gui" -q

  package-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (editable) with CLI extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[gui]"
      - name: Test CLI import
        run: |
          python -c "import srt_translator, srt_translator.cli.app; print('CLI import ok')"
          srtx --help

  gui-import:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (editable) with GUI extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[gui]"
      - name: Test GUI import
        run: |
          python -c "import srt_translator; import srt_translator.gui.main_window as _; print('GUI import OK')"

  security-scan:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install security tools
        run: |
          python -m pip install -U pip
          python -m pip install safety bandit
      - name: Safety
        run: safety scan --full-report
      - name: Bandit
        run: bandit -r srt_translator -x tests

  golden-tests:
    name: Golden Structure & Invariants
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Run golden tests
        env:
          PYTHONWARNINGS: default
        run: |
          pytest tests/test_golden_srt.py -q

      - name: Always upload pytest cache (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-pytest-cache-${{ matrix.os }}
          path: ./.pytest_cache
