name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip
      - run: pip install .[dev]
      - run: ruff . && black --check . && mypy srt_translator
      - run: pytest -m "not gui" -q

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: |
          python -c "import srt_translator, srt_translator.cli.app; print('CLI import ok')"
          srtx --help

  gui-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -U pip build
      - run: python -m build
      - run: pip install 'dist\*.whl[gui]'
      - shell: python
        run: |
          try:
              import srt_translator.gui.main_window as mw
              print("GUI import ok")
          except Exception as e:
              raise SystemExit(1)
