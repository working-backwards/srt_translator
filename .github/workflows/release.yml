name: Build GUI & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-14]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip wheel
          pip install ".[gui]"
          pip install pyinstaller

      - name: Build (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean build_specs/srt_translator_gui.spec

      - name: Smoke check (embedded resources)
        run: |
          python - <<'PY'
          from srt_translator.config import load_language_catalog, load_evaluation_rubric
          langs = load_language_catalog()
          rub = load_evaluation_rubric()
          assert langs and isinstance(langs, dict)
          assert "caps" in rub
          print("OK: embedded resources load")
          PY

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/SRT-Translator.exe "release/SRT-Translator-${{ github.ref_name }}-win.exe"
            certutil -hashfile "release/SRT-Translator-${{ github.ref_name }}-win.exe" SHA256 > "release/SRT-Translator-${{ github.ref_name }}-win.exe.sha256"
          else
            APP_DIR="dist/SRT Translator/SRT Translator.app"
            [ -d "$APP_DIR" ] || { echo "App not found: $APP_DIR"; exit 1; }
            mkdir -p dmgroot
            cp -R "$APP_DIR" dmgroot/
            hdiutil create -volname "SRT Translator" -srcfolder dmgroot -ov -format UDZO "release/SRT-Translator-${{ github.ref_name }}-mac.dmg"
            shasum -a 256 "release/SRT-Translator-${{ github.ref_name }}-mac.dmg" > "release/SRT-Translator-${{ github.ref_name }}-mac.dmg.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-release
          path: release/**

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
