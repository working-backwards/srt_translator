name: Build GUI & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-14]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip wheel
          pip install ".[gui]"
          pip install pyinstaller

      - name: Build (PyInstaller via script)
        run: |
          python scripts/build_app.py

      - name: Smoke check (embedded resources)
        run: |
          python - <<'PY'
          from srt_translator.config import load_language_catalog, load_evaluation_rubric
          langs = load_language_catalog()
          rub = load_evaluation_rubric()
          assert langs and isinstance(langs, dict)
          assert "caps" in rub
          print("OK: embedded resources load")
          PY

      - name: Setup codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          # Decode and save cert
          echo "${{ secrets.APPLE_P12_BASE64 }}" | base64 --decode > /tmp/apple_cert.p12
          echo "${{ secrets.NOTARY_KEY_P8_BASE64 }}" | base64 --decode > /tmp/notary_key.p8

          # Create ephemeral keychain
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

          # Import cert and set up for codesign
          security import /tmp/apple_cert.p12 -k build.keychain -P "${{ secrets.APPLE_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

      - name: Codesign app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR="dist/SRT Translator.app"
          [ -d "$APP_DIR" ] || { echo "App not found: $APP_DIR"; exit 1; }

          # Codesign with entitlements and timestamp
          /usr/bin/codesign --deep --options runtime --timestamp --sign "${{ secrets.APP_SIGN_IDENTITY }}" "$APP_DIR"

          # Verify codesign
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_DIR"

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/SRT-Translator.exe "release/SRT-Translator-${{ github.ref_name }}-win.exe"
            certutil -hashfile "release/SRT-Translator-${{ github.ref_name }}-win.exe" SHA256 > "release/SRT-Translator-${{ github.ref_name }}-win.exe.sha256"
          else
            APP_DIR="dist/SRT Translator.app"
            [ -d "$APP_DIR" ] || { echo "App not found: $APP_DIR"; exit 1; }
            mkdir -p dmgroot
            cp -R "$APP_DIR" dmgroot/
            hdiutil create -volname "SRT Translator" -srcfolder dmgroot -ov -format UDZO "release/SRT-Translator-${{ github.ref_name }}-mac.dmg"
          fi

      - name: Notarize & staple DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG_PATH="release/SRT-Translator-${{ github.ref_name }}-mac.dmg"

          # Submit for notarization
          echo "Submitting DMG for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --key /tmp/notary_key.p8 \
            --key-id "${{ secrets.NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.NOTARY_ISSUER_ID }}" \
            --wait

          # Staple the notarization ticket
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"

          # Verify stapling
          echo "Verifying stapling..."
          xcrun stapler validate "$DMG_PATH"

          # Create SHA256
          shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"

      - name: Cleanup codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          # Delete ephemeral keychain and temp files
          security delete-keychain build.keychain
          rm -f /tmp/apple_cert.p12 /tmp/notary_key.p8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-release
          path: release/**

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
