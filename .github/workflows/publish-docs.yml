name: Publish Docs to docs.workingbackwards.com

on:
  push:
    branches: ["main"]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/publish-docs.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Shared docs hub — each project publishes to its own subdirectory
  PUBLIC_DOCS_REPO: working-backwards/docs

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private repo (docs source)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs deps via pyproject extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Build MkDocs site
        run: mkdocs build --clean

      # Push built site/ into the srt-translator subdirectory of the shared docs repo
      - name: Publish to docs hub (srt-translator subdirectory)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          external_repository: ${{ env.PUBLIC_DOCS_REPO }}
          publish_dir: ./site
          publish_branch: gh-pages
          destination_dir: srt-translator
          keep_files: true
          cname: docs.workingbackwards.com
