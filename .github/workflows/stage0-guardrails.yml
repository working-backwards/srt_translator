name: Stage 0 Guardrails

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  stage0-guardrails:
    name: Stage 0 Prompt Snapshot Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Run Stage 0 Prompt Snapshot Tests
      run: |
        pytest tests/test_prompts_snapshot.py -q
      env:
        PYTHONPATH: ${{ github.workspace }}
