name: Security and Quality Checks

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  release:
    types: [published]

jobs:
  test-matrix:
    name: Test Matrix (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Exclude Python 3.12 on older macOS runners for compatibility
          - python: '3.12'
            os: macos-latest
          # Exclude Python 3.9 on Windows for better compatibility
          - python: '3.9'
            os: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Black (code formatting check)
      run: black --check --diff srt_translator/ tests/

    - name: Run isort (import sorting check)
      run: isort --check-only --diff srt_translator/ tests/

    - name: Run Pylint
      run: pylint srt_translator/ --output-format=json --reports=y || true

    - name: Run MyPy (type checking)
      run: mypy srt_translator/ --ignore-missing-imports || true

    - name: Run Flake8
      run: flake8 srt_translator/ --format=json || true

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=srt_translator --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports-${{ matrix.os }}-${{ matrix.python }}
        path: |
          coverage.xml
          htmlcov/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit pip-audit

    - name: Run Safety (dependency vulnerability scan)
      run: |
        safety check --json --output safety-report.json || true
        echo "Safety scan completed"

    - name: Run Bandit (security linting)
      run: |
        bandit -r srt_translator/ -f json -o bandit-report.json || true
        echo "Bandit scan completed"

    - name: Run pip-audit
      run: |
        pip-audit --json --output pip-audit-report.json || true
        echo "pip-audit completed"

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          pip-audit-report.json

  dependency-update-check:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install pip-tools
      run: pip install pip-tools

    - name: Check for outdated dependencies
      run: |
        pip list --outdated --format=json > outdated-deps.json
        echo "Dependency check completed"

    - name: Upload dependency report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-reports
        path: outdated-deps.json

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [test-matrix, security-scan]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-packages
        path: dist/
