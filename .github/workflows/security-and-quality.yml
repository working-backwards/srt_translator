name: Security and Quality Checks

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  release:
    types: [published]

jobs:
  test-matrix:
    name: Test Matrix (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,gui]"

    - name: Ruff (lint)
      run: ruff check .

    - name: mypy
      run: mypy srt_translator

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=srt_translator --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports-${{ matrix.os }}-${{ matrix.python }}
        path: |
          coverage.xml
          htmlcov/

  security-scan:
    name: Security Scan
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tools
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install bandit pip-audit
        python -m pip install -e ".[dev]"

    - name: Bandit (SAST)
      shell: bash
      run: bandit -q -r srt_translator -x tests

    - name: pip-audit (vulns; no API key)
      shell: bash
      run: |
        # audit installed environment (no auth required)
        pip-audit -v \ 
        --ignore-vuln CVE-2026-4539

  dependency-update-check:
    name: Dependency Update Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    if: github.event_name == 'schedule'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pip-tools
      run: python -m pip install pip-tools

    - name: Check for outdated dependencies
      run: |
        python -m pip list --outdated --format=json > outdated-deps.json
        echo "Dependency check completed"

    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-reports-${{ matrix.os }}
        path: outdated-deps.json

  build-release:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']
    if: github.event_name == 'release'
    needs: [test-matrix, security-scan]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-packages-${{ matrix.os }}
        path: dist/
