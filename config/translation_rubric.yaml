meta:
  version: 1
  notes:
    - "'subtitle' == 'cue'."
    - "CPS = characters / seconds."
    - "If the ORIGINAL exceeds CPS caps, do not penalize the translation."

caps:
  defaults: { cps_soft: 15, cps_hard: 20 }
  per_language:
    zh-Hans: { cps_soft: 12, cps_hard: 15 }
    # You can add more languages here if needed. If absent, defaults apply.

untranslated_after_dnt:
  min_remainder_len: 5                # ignore trivial single-word cognates like "plan"
  uppercase_acronym_treated_as: info  # PRFAQ/S3/etc. INFO unless in DNT/TB

fragments:
  mode: auto_non_latin                # only emit fragments CSV for non-Latin scripts

report:
  show_all_issues: true
  show_timing_drift_when_empty: false # hide drift section if no findings
