[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srt_translator*"]
exclude = ["tests*", "scripts*", "build_specs*", "design_docs*", "translation_logs*", "original_captions*", "translated_srt_files*"]

[tool.setuptools.package-data]
"srt_translator.gui" = ["**/*.ui", "**/*.qss", "assets/**"]
"srt_translator.core.config" = ["languages.json"]

[project]
name = "srt-translator"
version = "1.0.0rc1"
description = "A subtitle translation tool with CLI and GUI interfaces"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "srt>=3.5.2,<4.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    "psutil>=5.9.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "pylint>=2.17.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=5.0.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
    "pip-tools>=7.0.0",
    "ruff>=0.1.0",
]
gui = [
    "PySide6>=6.6.0,<7.0.0",
]

# Build scripts
[project.scripts]
srtx = "srt_translator.gui.main_window:main"
srtx-cli = "srt_translator.cli.app:main"

# PyInstaller configuration
#[tool.pyinstaller]
# PyInstaller is configured via spec files in `build_specs/`.
# This section was removed to keep `pyproject.toml` TOML‑valid.

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["srt_translator"]
known_third_party = ["openai", "srt", "dotenv"]
skip = ["venv", ".venv", ".git", "__pycache__", ".pytest_cache", ".mypy_cache"]

# Pylint configuration
[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0301",  # line-too-long (handled by black)
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0902",  # too-many-instance-attributes
    "R0904",  # too-many-public-methods
    "R0917",  # too-many-positional-arguments
    "W0621",  # redefined-outer-name (common in tests)
    "W0622",  # redefined-builtin
    "W0703",  # broad-except
    "W0612",  # unused-variable
    "W0611",  # unused-import
    "W1203",  # logging-fstring-interpolation (f-strings are fine)
    "R0801",  # duplicate-code (normal in UI patterns)
    "E0611",  # no-name-in-module (PySide6 detection issue)
]

[tool.pylint.master]
ignore = ["venv", ".venv", ".git", "__pycache__", ".pytest_cache", ".mypy_cache"]

[tool.pylint.format]
max-line-length = 88
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "db"]

[tool.pylint.design]
max-args = 10
max-locals = 20
max-returns = 10
max-branches = 15
max-statements = 60
max-parents = 7
max-attributes = 10
min-public-methods = 0
max-public-methods = 30

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = "yes"
ignore-docstrings = "yes"
ignore-imports = "yes"

# Flake8 configuration
[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".pytest_cache",
    ".mypy_cache",
]

# Ruff configuration for import enforcement
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "TID"]
# TID = flake8-tidy-imports rules

# Note: We'll use a different approach for import enforcement
# The current ruff rules are too broad for our use case
# We'll implement this with custom linting rules or CI checks

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# MyPy configuration (optional but recommended)
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for existing codebase
disallow_incomplete_defs = false  # Relaxed for existing codebase
check_untyped_defs = true
disallow_untyped_decorators = false  # Relaxed for existing codebase
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "srt.*",
    "openai.*",
    "PySide6.*",
    "PySide6.QtCore.*",
    "PySide6.QtWidgets.*",
    "PySide6.QtGui.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "gui: marks tests as GUI tests (deselect with '-m \"not gui\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
