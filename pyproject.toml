[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srt_translator*"]
exclude = ["tests*", "scripts*", "build_specs*", "design_docs*", "translation_logs*", "original_captions*", "translated_srt_files*"]

[tool.setuptools.package-data]
"srt_translator.gui" = ["**/*.ui", "**/*.qss", "assets/**"]
"srt_translator.core.config" = ["languages.json"]

[project]
name = "srt-translator"
version = "1.0.0"
description = "A subtitle translation tool with CLI and GUI interfaces"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "srt>=3.5.2,<4.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    "psutil>=5.9.0,<7.0.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=5.0.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
    "pip-tools>=7.0.0",
]
gui = [
    "PySide6>=6.6.0,<7.0.0",
]

# Build scripts
[project.scripts]
srtx = "srt_translator.gui.app:main"
srtx-cli = "srt_translator.cli.app:main"

# PyInstaller configuration
#[tool.pyinstaller]
# PyInstaller is configured via spec files in `build_specs/`.
# This section was removed to keep `pyproject.toml` TOML‑valid.

# Ruff configuration (replaces Black, isort, flake8, pylint)
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "TID"]
# E = pycodestyle errors, F = pyflakes, I = isort, B = flake8-bugbear, TID = flake8-tidy-imports

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Note: Pylint and Flake8 configurations removed - now handled by Ruff

# MyPy configuration (optional but recommended)
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for existing codebase
disallow_incomplete_defs = false  # Relaxed for existing codebase

# Safety configuration for dependency vulnerability scanning
[tool.safety]
# Safety will scan requirements and installed packages for known vulnerabilities
# Run with: safety check --full-report
check_untyped_defs = true
disallow_untyped_decorators = false  # Relaxed for existing codebase
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "srt.*",
    "openai.*",
    "PySide6.*",
    "PySide6.QtCore.*",
    "PySide6.QtWidgets.*",
    "PySide6.QtGui.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "gui: marks tests as GUI tests (deselect with '-m \"not gui\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
