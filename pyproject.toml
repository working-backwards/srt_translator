[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srt_translator*"]
exclude = ["tests*", "scripts*", "build_specs*", "design_docs*", "translation_logs*", "original_captions*", "translated_srt_files*"]

[tool.setuptools.package-data]
"srt_translator.gui" = ["**/*.ui", "**/*.qss", "assets/**"]
"srt_translator.config" = ["languages.json", "translation_rubric.yaml"]
"srt_translator.presenters.eval_html.assets" = ["*.css", "*.js", "*.png", "*.svg", "*.ico", "*.jpg", "*.gif", "*.webp"]

[project]
name = "srt-translator"
version = "1.0.0"
description = "A subtitle translation tool with CLI and GUI interfaces"
authors = [
    {name = "Working Backwards LLC", email = "ColinB-WB@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai == 1.109.1",
    "jiter == 0.12.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "srt>=3.5.2,<4.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    "psutil>=5.9.0,<7.0.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=5.0.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
    "pip-tools>=7.0.0",
]
gui = [
    "PySide6>=6.6.0,<7.0.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

# Build scripts
[project.scripts]
srtx = "srt_translator.gui.app:main"
srtx-cli = "srt_translator.cli.app:main"
st-eval = "srt_translator.eval.cli:main"

# PyInstaller configuration
#[tool.pyinstaller]
# PyInstaller is configured via spec files in `build_specs/`.
# This section was removed to keep `pyproject.toml` TOML‑valid.

# Ruff configuration (replaces Black, isort, flake8, pylint)
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "TID", "G", "ARG", "UP"]
ignore = ["E501"]  # Temporarily ignore line length for v1.0 release
# E/F = correctness; I = import order; B = bugbear; TID = tidy-imports
# G = logging-format (ban f-strings/formatting in logger calls)
# ARG = unused-arguments; UP = pyupgrade (keep syntax modern)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]  # allow unused args in test fixtures/mocks

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Note: Pylint and Flake8 configurations removed - now handled by Ruff

# Safety configuration for dependency vulnerability scanning
[tool.safety]
# Safety will scan requirements and installed packages for known vulnerabilities
# Run with: safety check --full-report

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "gui: marks tests as GUI tests (deselect with '-m \"not gui\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
