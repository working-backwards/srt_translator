[mypy]
python_version = 3.10
mypy_path = .
explicit_package_bases = True
warn_unused_ignores = True
disallow_untyped_defs = True
no_implicit_optional = True
strict = True
# We invoke mypy in package mode via pre-commit; use per-module scopes below.

# Temporarily relax GUI typing
[mypy-srt_translator.gui.*]
ignore_errors = True

# Temporarily relax eval & infra while we type them incrementally
[mypy-srt_translator.eval.*]
ignore_errors = True
[mypy-srt_translator.core.config.*]
ignore_errors = True
[mypy-srt_translator.core.utils.*]
ignore_errors = True
[mypy-srt_translator.core.services.*]
ignore_errors = True
[mypy-srt_translator.core.main]
ignore_errors = True

# Inside translator/, keep only the orchestrator strict for now
[mypy-srt_translator.core.translator.term_handler]
ignore_errors = True
[mypy-srt_translator.core.translator.srt_parser]
ignore_errors = True
[mypy-srt_translator.core.translator.fixer]
ignore_errors = True
[mypy-srt_translator.core.translator.utils]
ignore_errors = True
[mypy-srt_translator.core.translator._helpers]
ignore_errors = True

# 3rd-party libs without types: acceptable for v1.0
[mypy-srt.*]
ignore_missing_imports = True
[mypy-openai.*]
ignore_missing_imports = True

# Keep PyQt/PySide ignored if present
[mypy-PyQt5.*]
ignore_missing_imports = True
[mypy-PySide6.*]
ignore_missing_imports = True
